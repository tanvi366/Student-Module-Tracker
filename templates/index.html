<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
    <title>Student Career Tracker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Student Career Tracker</h1>
        <p>Track your internships and job applications.</p>
    </header>

    <main>
        <section class="dashboard">
            <div class="stat-card">
                <h3>Total Applications</h3>
                <p id="total-applications">0</p>
            </div>
            <div class="stat-card">
                <h3>Interviews</h3>
                <p id="interviews">0</p>
            </div>
            <div class="stat-card">
                <h3>Offers</h3>
                <p id="offers">0</p>
            </div>
        </section>
        <section id="deadline-notifications" class="deadline-notifications">
        </section>
        <section>
            <h2>Application Overview</h2>
            <canvas id="status-chart"></canvas>
        </section>
        <section class="form-section">
            <h2>Add Application</h2>
            <form id="application-form">
                <input type="text" id="company" placeholder="company" required>
                <input type="text" id="role" placeholder="Job Role" required>
                <input type="text" id="location" placeholder="Location">
                <select id="status">
                    <option value="Applied">Applied</option>
                    <option value="Online Assessment">Online Assessment</option>
                    <option value="Interview">Interview</option>
                    <option value="Offer">Offer</option>
                    <option value="Rejected">Rejected</option>
                </select>
                <label for="application_date">Application Date</label>
                <input type="date" id="application-date" required>
                <label for="deadline">Application Deadline</label>
                <input type="date" id="deadline" required>
                <input type="url" id="job-url" placeholder="Job posting URL (optional)">
                <textarea id="notes" placeholder="Notes (optional)"></textarea>
                <button type="submit">Add Application</button>
            </form>
        </section>
        <div class="filters">
            <input type="text" id="search" placeholder="Search company or role...">
            <select id="status-filter">

    <option value="">
        All Statuses
    </option>

    <option value="Applied">
        Applied
    </option>

    <option value="Online Assessment">
        Online Assessment
    </option>

    <option value="Interview">
        Interview
    </option>

    <option value="Offer">
        Offer
    </option>

    <option value="Rejected">
        Rejected
    </option>

</select>
        </div>
        <h2>Your Applications</h2>
        <div id="applications-container">
            Loading applications...
        </div>
    </main>

        <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
